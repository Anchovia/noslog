<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>NosLog 2.0 · Data visualization anatomy source comparison</title>
        <style>
            * {
                box-sizing: border-box;
            }
            :root {
                color-scheme: light;
                --canvas: #f8f8f8;
                --surface: #ffffff;
                --raised: #ffffff;
                --fg: #292929;
                --fg-2: #5c5c5c;
                --fg-3: #767676;
                --border: #d7d7d7;
                --divider: #e8e8e8;
                --focus: #000000;
                --data-1: #168eff;
                --data-2: #c87b00;
                --grid: #e8e8e8;
                --tooltip: #ffffff;
                font-family:
                    Pretendard, "Pretendard JP", Inter, system-ui, sans-serif;
            }
            body.dark {
                color-scheme: dark;
                --canvas: #111111;
                --surface: #1b1b1b;
                --raised: #222222;
                --fg: #dbdbdb;
                --fg-2: #afafaf;
                --fg-3: #8a8a8a;
                --border: #393939;
                --divider: #2c2c2c;
                --focus: #ffffff;
                --data-1: #3278be;
                --data-2: #f2a634;
                --grid: #303030;
                --tooltip: #222222;
            }
            html,
            body {
                min-width: 0;
                margin: 0;
                background: var(--canvas);
                color: var(--fg);
            }
            body {
                min-height: 100vh;
            }
            button {
                font: inherit;
            }
            button:focus-visible,
            [tabindex="0"]:focus-visible {
                outline: 2px solid var(--focus);
                outline-offset: 2px;
            }
            .shell {
                width: min(1440px, 100%);
                margin: 0 auto;
                padding: 20px;
            }
            .panel {
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--surface);
            }
            .intro {
                padding: 18px;
            }
            .kicker {
                margin: 0 0 6px;
                color: var(--fg-3);
                font-size: 11px;
                font-weight: 800;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }
            h1,
            h2,
            h3,
            p {
                margin: 0;
            }
            h1 {
                font-size: clamp(22px, 4vw, 34px);
                line-height: 1.15;
            }
            .intro p:last-child {
                max-width: 900px;
                margin-top: 9px;
                color: var(--fg-2);
                font-size: 14px;
                line-height: 1.6;
            }
            .boundary {
                margin-top: 10px;
                padding: 12px 14px;
                color: var(--fg-2);
                font-size: 13px;
                line-height: 1.55;
            }
            .boundary strong {
                color: var(--fg);
            }
            .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-top: 10px;
                padding: 10px;
            }
            .controls button,
            .chart-action,
            .view-button,
            .table-toggle {
                min-height: 40px;
                border: 1px solid var(--border);
                border-radius: 4px;
                padding: 0 10px;
                background: var(--raised);
                color: var(--fg-2);
                cursor: pointer;
                transition:
                    color 50ms cubic-bezier(0.4, 1, 0.6, 1),
                    background-color 50ms cubic-bezier(0.4, 1, 0.6, 1),
                    border-color 50ms cubic-bezier(0.4, 1, 0.6, 1);
            }
            .controls button[aria-pressed="true"],
            .view-button[aria-pressed="true"] {
                border-color: var(--fg);
                background: var(--fg);
                color: var(--canvas);
            }
            .comparison {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
                margin-top: 12px;
            }
            .candidate {
                min-width: 0;
                overflow: clip;
            }
            .candidate-head {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 12px;
                align-items: start;
                min-height: 92px;
                padding: 14px;
                border-bottom: 1px solid var(--divider);
            }
            .candidate-head h2 {
                font-size: 16px;
                line-height: 1.3;
            }
            .candidate-head p {
                margin-top: 5px;
                color: var(--fg-2);
                font-size: 12px;
                line-height: 1.5;
            }
            .tag {
                align-self: start;
                border: 1px solid var(--border);
                border-radius: 999px;
                padding: 4px 7px;
                color: var(--fg-3);
                font-size: 10px;
                font-weight: 800;
                white-space: nowrap;
            }
            .tag.recommended {
                border-color: var(--fg);
                color: var(--fg);
            }
            .chart-card {
                position: relative;
                margin: 12px;
                border: 1px solid var(--border);
                border-radius: 6px;
                background: var(--raised);
            }
            .chart-header {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 10px;
                align-items: start;
                min-height: 72px;
                padding: 12px;
                border-bottom: 1px solid var(--divider);
            }
            .chart-header h3 {
                font-size: 14px;
                line-height: 1.35;
            }
            .chart-header p {
                margin-top: 3px;
                color: var(--fg-3);
                font-size: 11px;
                line-height: 1.45;
            }
            .latest {
                color: var(--fg-2);
                font-size: 11px;
                text-align: right;
                white-space: nowrap;
            }
            .latest strong {
                display: block;
                margin-top: 2px;
                color: var(--fg);
                font-size: 15px;
                font-variant-numeric: tabular-nums;
            }
            .toolbar {
                display: flex;
                flex-wrap: wrap;
                justify-content: flex-end;
                gap: 4px;
            }
            .chart-action,
            .view-button {
                min-height: 32px;
                padding: 0 8px;
                font-size: 11px;
            }
            .legend {
                display: flex;
                flex-wrap: wrap;
                gap: 8px 14px;
                padding: 9px 12px 0;
                color: var(--fg-2);
                font-size: 11px;
            }
            .legend-item {
                display: inline-flex;
                min-width: 0;
                align-items: center;
                gap: 6px;
            }
            .legend-item strong {
                color: var(--fg);
                font-variant-numeric: tabular-nums;
            }
            .swatch {
                width: 18px;
                height: 2px;
                flex: 0 0 18px;
                background: var(--data-1);
            }
            .swatch.second {
                height: 0;
                border-top: 2px dashed var(--data-2);
                background: none;
            }
            .spectrum .swatch.second {
                height: 2px;
                border: 0;
                background: var(--data-2);
            }
            .plot-wrap {
                position: relative;
                min-width: 0;
                padding: 4px 8px 0;
            }
            .plot {
                display: block;
                width: 100%;
                height: auto;
                min-height: 230px;
                overflow: visible;
            }
            .grid-line {
                stroke: var(--grid);
                stroke-width: 1;
                vector-effect: non-scaling-stroke;
            }
            .axis-line {
                stroke: var(--fg-3);
                stroke-width: 1;
                vector-effect: non-scaling-stroke;
            }
            .axis-text {
                fill: var(--fg-3);
                font-size: 12px;
                font-family: inherit;
            }
            .axis-title {
                fill: var(--fg-2);
                font-size: 12px;
                font-weight: 700;
                font-family: inherit;
            }
            .series {
                fill: none;
                stroke-width: 2;
                vector-effect: non-scaling-stroke;
            }
            .series-a {
                stroke: var(--data-1);
            }
            .series-b {
                stroke: var(--data-2);
                stroke-dasharray: 6 4;
            }
            .spectrum .series-b {
                stroke-dasharray: none;
            }
            .point {
                cursor: pointer;
                stroke-width: 2;
                vector-effect: non-scaling-stroke;
            }
            .point-a {
                fill: var(--raised);
                stroke: var(--data-1);
            }
            .point-b {
                fill: var(--data-2);
                stroke: var(--raised);
            }
            .spectrum .point-b {
                fill: var(--raised);
                stroke: var(--data-2);
            }
            .crosshair {
                stroke: var(--fg-3);
                stroke-width: 1;
                stroke-dasharray: 2 3;
                vector-effect: non-scaling-stroke;
                opacity: 0;
            }
            .crosshair.active {
                opacity: 1;
            }
            .direct-label {
                fill: var(--fg);
                font-size: 11px;
                font-weight: 750;
                font-family: inherit;
                paint-order: stroke;
                stroke: var(--raised);
                stroke-width: 3px;
            }
            .annotation-line {
                stroke: var(--fg-2);
                stroke-width: 1;
                vector-effect: non-scaling-stroke;
            }
            .annotation {
                fill: var(--fg);
                font-size: 11px;
                font-weight: 700;
                font-family: inherit;
                paint-order: stroke;
                stroke: var(--raised);
                stroke-width: 3px;
            }
            .tooltip {
                position: absolute;
                z-index: 5;
                min-width: 152px;
                max-width: 220px;
                pointer-events: none;
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 8px 9px;
                background: var(--tooltip);
                box-shadow: 0 6px 18px rgb(0 0 0 / 0.14);
                color: var(--fg-2);
                font-size: 11px;
                line-height: 1.45;
                opacity: 0;
                transform: translate(-50%, calc(-100% - 10px));
            }
            .tooltip.visible {
                opacity: 1;
            }
            .tooltip strong {
                display: block;
                color: var(--fg);
                font-size: 12px;
                font-variant-numeric: tabular-nums;
            }
            .source-note,
            .chart-summary {
                padding: 0 12px 10px;
                color: var(--fg-3);
                font-size: 10px;
                line-height: 1.45;
            }
            .chart-summary {
                padding-top: 7px;
                color: var(--fg-2);
                font-size: 11px;
            }
            .table-toggle {
                min-height: 36px;
                margin: 0 12px 12px;
                font-size: 11px;
            }
            .data-table-wrap {
                margin: 0 12px 12px;
                overflow-x: auto;
                border: 1px solid var(--border);
                border-radius: 4px;
            }
            .data-table-wrap[hidden] {
                display: none;
            }
            table {
                width: 100%;
                min-width: 390px;
                border-collapse: collapse;
                color: var(--fg-2);
                font-size: 11px;
                font-variant-numeric: tabular-nums;
            }
            caption {
                padding: 8px;
                color: var(--fg);
                font-weight: 750;
                text-align: left;
            }
            th,
            td {
                border-top: 1px solid var(--divider);
                padding: 7px 8px;
                text-align: right;
                white-space: nowrap;
            }
            th:first-child,
            td:first-child {
                text-align: left;
            }
            thead th {
                color: var(--fg);
                font-weight: 700;
            }
            tbody th {
                color: var(--fg-2);
                font-weight: 600;
            }
            .carbon .legend {
                display: none;
            }
            .carbon .chart-summary {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 6px;
            }
            .carbon .chart-summary span {
                border-left: 2px solid var(--data-1);
                padding-left: 7px;
            }
            .carbon .chart-summary span:last-child {
                border-left-color: var(--data-2);
            }
            .sap .chart-header {
                align-items: center;
            }
            .gitlab .legend {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .primer .chart-card {
                box-shadow: 0 1px 0 rgb(0 0 0 / 0.03);
            }
            .gov .chart-header {
                grid-template-columns: 1fr;
            }
            .gov .latest,
            .gov .legend {
                display: none;
            }
            .gov .chart-header h3 {
                font-size: 17px;
            }
            .gov .chart-header p {
                font-size: 12px;
            }
            .gov .data-table-wrap {
                display: block;
            }
            body.colorless {
                --data-1: var(--fg);
                --data-2: var(--fg);
            }
            .colorless .point-a {
                fill: var(--raised);
            }
            .colorless .point-b {
                fill: var(--fg);
            }
            .colorless .spectrum .point-b {
                fill: var(--raised);
            }
            .live {
                position: fixed;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip-path: inset(50%);
                white-space: nowrap;
            }
            @media (max-width: 980px) {
                .comparison {
                    grid-template-columns: 1fr;
                }
            }
            @media (max-width: 520px) {
                .shell {
                    padding: 10px;
                }
                .candidate-head,
                .chart-header {
                    grid-template-columns: 1fr;
                    min-height: 0;
                }
                .latest {
                    text-align: left;
                }
                .toolbar {
                    justify-content: flex-start;
                }
                .plot {
                    min-height: 205px;
                }
                .legend,
                .gitlab .legend {
                    display: grid;
                    grid-template-columns: 1fr;
                }
                .carbon .legend,
                .gov .legend {
                    display: none;
                }
            }
            @media (max-width: 340px) {
                .intro,
                .candidate-head {
                    padding: 12px;
                }
                .chart-card {
                    margin: 8px;
                }
                .chart-header {
                    padding: 10px;
                }
                .plot-wrap {
                    padding-inline: 2px;
                }
                .plot {
                    min-height: 190px;
                }
            }
            @media (forced-colors: active) {
                .panel,
                .chart-card,
                .controls button,
                .chart-action,
                .view-button,
                .table-toggle,
                .data-table-wrap {
                    border-color: CanvasText;
                }
                .series-a {
                    stroke: CanvasText;
                }
                .series-b {
                    stroke: CanvasText;
                }
                .point {
                    stroke: CanvasText;
                }
            }
        </style>
    </head>

                    caption: "Personal best and top-10% benchmark",
                    annotation: "Gap reduced to 1,580 points",
                    csvStatus:
                        "This specimen compares the placement of the CSV action only.",
                    candidates: [
                        [
                            "DV-01 · Adobe Spectrum 2.0.0",
                            "Explicit axis titles, legend, crosshair, and keyboard point focus. It conflicts with the approved FAST/SLOW line/marker contract.",
                            "Source conflict",
                        ],
                        [
                            "DV-02 · IBM Carbon",
                            "Prioritizes direct end labels over a legend and keeps exact current values near the plot.",
                            "Candidate",
                        ],
                        [
                            "DV-03 · SAP Fiori",
                            "Gives chart and table equal views inside an analytical toolbar.",
                            "Candidate",
                        ],
                        [
                            "DV-04 · GitLab Pajamas",
                            "The legend communicates each series name and its current exact value.",
                            "Candidate",
                        ],
                        [
                            "DV-05 · GitHub Primer",
                            "Combines header, axes, legend, crosshair, non-color marks, and table preview in one source.",
                            "Recommended",
                        ],
                        [
                            "DV-06 · GOV.UK",
                            "Leads with the message and annotation and keeps the complete table immediately visible.",
                            "Candidate",
                        ],
                    ],
                },
            };
            const candidates = [
                {
                    id: "DV-01",
                    kind: "spectrum",
                    legend: true,
                    direct: true,
                    actions: "table",
                },
                {
                    id: "DV-02",
                    kind: "carbon",
                    legend: false,
                    direct: true,
                    actions: "table",
                    summary: true,
                },
                {
                    id: "DV-03",
                    kind: "sap",
                    legend: true,
                    direct: false,
                    actions: "switch",
                },
                {
                    id: "DV-04",
                    kind: "gitlab",
                    legend: true,
                    direct: false,
                    actions: "table",
                    legendValues: true,
                },
                {
                    id: "DV-05",
                    kind: "primer",
                    legend: true,
                    direct: false,
                    actions: "primer",
                },
                {
                    id: "DV-06",
                    kind: "gov",
                    legend: false,
                    direct: false,
                    actions: "always",
                    annotation: true,
                },
            ];
            let lang = new URLSearchParams(location.search).get("lang") || "ko";
            if (!copies[lang]) lang = "ko";
            const nf = () =>
                new Intl.NumberFormat(
                    lang === "ko" ? "ko-KR" : lang === "ja" ? "ja-JP" : "en-US"
                );
            const x = (index) => 72 + index * 82;
            const y = (value) => 220 - ((value - 960000) / 30000) * 150;
            const linePath = (key) =>
                rows
                    .map(
                        (row, index) =>
                            `${index ? "L" : "M"}${x(index)},${y(row[key])}`
                    )
                    .join(" ");
            const svg = (candidate, copy) => {
                const ticks = [960000, 970000, 980000, 990000];
                const grid = ticks
                    .map(
                        (value) =>
                            `<line class="grid-line" x1="64" y1="${y(value)}" x2="402" y2="${y(value)}"/><text class="axis-text" x="56" y="${y(value) + 4}" text-anchor="end">${Math.round(value / 1000)}k</text>`
                    )
                    .join("");
                const dates = rows
                    .map(
                        (row, index) =>
                            `<text class="axis-text" x="${x(index)}" y="241" text-anchor="middle">${row.date}</text>`
                    )
                    .join("");
                const point = (row, index, key, seriesIndex) => {
                    const isB = key === "benchmark";
                    const shape =
                        isB && candidate.kind !== "spectrum"
                            ? `<rect class="point point-b" data-series="${seriesIndex}" data-index="${index}" tabindex="0" role="graphics-symbol" aria-label="${row.date}, ${isB ? copy.benchmark : copy.personal}, ${nf().format(row[key])} ${copy.unit}" x="${x(index) - 4}" y="${y(row[key]) - 4}" width="8" height="8"/>`
                            : `<circle class="point ${isB ? "point-b" : "point-a"}" data-series="${seriesIndex}" data-index="${index}" tabindex="0" role="graphics-symbol" aria-label="${row.date}, ${isB ? copy.benchmark : copy.personal}, ${nf().format(row[key])} ${copy.unit}" cx="${x(index)}" cy="${y(row[key])}" r="4"/>`;
                    return shape;
                };
                const pointsA = rows
                    .map((row, index) => point(row, index, "personal", 0))
                    .join("");
                const pointsB = rows
                    .map((row, index) => point(row, index, "benchmark", 1))
                    .join("");
                const labels = candidate.direct
                    ? `<text class="direct-label" x="408" y="${y(rows.at(-1).personal) + 4}">${copy.personal}</text><text class="direct-label" x="408" y="${y(rows.at(-1).benchmark) + 4}">${copy.benchmark}</text>`
                    : "";
                const annotation = candidate.annotation
                    ? `<line class="annotation-line" x1="318" y1="${y(rows[3].personal) - 4}" x2="350" y2="82"/><text class="annotation" x="238" y="74">${copy.annotation}</text>`
                    : "";
                return `<svg class="plot" viewBox="0 0 520 265" role="graphics-document" aria-label="${copy.chartTitle}: ${copy.subtitle}">
                    <g aria-hidden="true">${grid}<line class="axis-line" x1="64" y1="220" x2="402" y2="220"/><line class="axis-line" x1="64" y1="70" x2="64" y2="220"/>${dates}<text class="axis-title" x="233" y="260" text-anchor="middle">${copy.date}</text><text class="axis-title" transform="translate(14 150) rotate(-90)" text-anchor="middle">${copy.unit}</text><line class="crosshair" x1="64" y1="70" x2="64" y2="220"/></g>
                    <path class="series series-a" aria-hidden="true" d="${linePath("personal")}"/><path class="series series-b" aria-hidden="true" d="${linePath("benchmark")}"/>
                    <g aria-label="${copy.personal}">${pointsA}</g><g aria-label="${copy.benchmark}">${pointsB}</g>${labels}${annotation}
                </svg>`;
            };
            const table = (candidate, copy) =>
                `<div class="data-table-wrap" ${candidate.actions === "always" ? "" : "hidden"}><table><caption>${copy.caption}</caption><thead><tr><th scope="col">${copy.date}</th><th scope="col">${copy.personal}</th><th scope="col">${copy.benchmark}</th></tr></thead><tbody>${rows.map((row) => `<tr><th scope="row">${row.date}</th><td>${nf().format(row.personal)}</td><td>${nf().format(row.benchmark)}</td></tr>`).join("")}</tbody></table></div>`;
            const legend = (candidate, copy) =>
                !candidate.legend
                    ? ""
                    : `<div class="legend" aria-label="Legend"><span class="legend-item"><span class="swatch"></span><span>${copy.personal}${candidate.legendValues ? ` · <strong>${nf().format(rows.at(-1).personal)}</strong>` : ""}</span></span><span class="legend-item"><span class="swatch second"></span><span>${copy.benchmark}${candidate.legendValues ? ` · <strong>${nf().format(rows.at(-1).benchmark)}</strong>` : ""}</span></span></div>`;
            const actions = (candidate, copy) => {
                if (candidate.actions === "switch")
                    return `<div class="toolbar" role="group" aria-label="View"><button class="view-button" type="button" data-view="chart" aria-pressed="true">${copy.chart}</button><button class="view-button" type="button" data-view="table" aria-pressed="false">${copy.table}</button></div>`;
                if (candidate.actions === "primer")
                    return `<div class="toolbar"><button class="chart-action" type="button" data-table>${copy.preview}</button><button class="chart-action" type="button" data-csv>${copy.csv}</button></div>`;
                return `<div class="latest">${copy.latest}<strong>${nf().format(rows.at(-1).personal)}</strong></div>`;
            };
            const card = (candidate, copy, index) => {
                const info = copy.candidates[index];
                const statusClass =
                    info[2] === "Recommended" ? "recommended" : "";
                const summary = candidate.summary
                    ? `<p class="chart-summary"><span>${copy.personal} <strong>${nf().format(rows.at(-1).personal)}</strong></span><span>${copy.benchmark} <strong>${nf().format(rows.at(-1).benchmark)}</strong></span></p>`
                    : "";
                const toggle =
                    candidate.actions === "table"
                        ? `<button class="table-toggle" type="button" data-table>${copy.table}</button>`
                        : "";
                return `<article class="panel candidate ${candidate.kind}" data-id="${candidate.id}"><header class="candidate-head"><div><h2>${info[0]}</h2><p>${info[1]}</p></div><span class="tag ${statusClass}">${info[2]}</span></header><section class="chart-card"><header class="chart-header"><div><h3>${candidate.annotation ? copy.annotation : copy.chartTitle}</h3><p>${copy.subtitle}</p></div>${actions(candidate, copy)}</header>${legend(candidate, copy)}${summary}<div class="plot-wrap"><div class="tooltip" role="tooltip"></div>${svg(candidate, copy)}</div><p class="source-note">${copy.source}</p>${toggle}${table(candidate, copy)}</section></article>`;
            };
            const render = () => {
                const copy = copies[lang];
                document.documentElement.lang = lang;
                document.querySelector("#page-title").textContent = copy.title;
                document.querySelector("#page-summary").textContent =
                    copy.summary;
                document.querySelector("#boundary").innerHTML = copy.boundary;
                document.querySelector("#comparison").innerHTML = candidates
                    .map((candidate, index) => card(candidate, copy, index))
                    .join("");
                bindInteractions();
            };
            const toggleTable = (candidate, force) => {
                const wrap = candidate.querySelector(".data-table-wrap");
                const open = force ?? wrap.hasAttribute("hidden");
                wrap.toggleAttribute("hidden", !open);
                candidate.querySelectorAll("[data-table]").forEach((button) => {
                    button.setAttribute("aria-expanded", String(open));
                    button.textContent = open
                        ? copies[lang].hideTable
                        : candidate.classList.contains("primer")
                          ? copies[lang].preview
                          : copies[lang].table;
                });
                candidate
                    .querySelectorAll("[data-view]")
                    .forEach((button) =>
                        button.setAttribute(
                            "aria-pressed",
                            String((button.dataset.view === "table") === open)
                        )
                    );
                candidate.querySelector(".plot-wrap").hidden =
                    candidate.classList.contains("sap") && open;
                const legendNode = candidate.querySelector(".legend");
                if (legendNode && candidate.classList.contains("sap"))
                    legendNode.hidden = open;
            };
            const showTooltip = (point) => {
                const candidate = point.closest(".candidate");
                const tooltip = candidate.querySelector(".tooltip");
                const row = rows[Number(point.dataset.index)];
                const key = Number(point.dataset.series)
                    ? "benchmark"
                    : "personal";
                const copy = copies[lang];
                const box = point.getBBox();
                tooltip.innerHTML = `<span>${row.date} · ${key === "personal" ? copy.personal : copy.benchmark}</span><strong>${nf().format(row[key])} ${copy.unit}</strong>`;
                tooltip.style.left = `${((box.x + box.width / 2) / 520) * 100}%`;
                tooltip.style.top = `${((box.y + box.height / 2) / 265) * 100}%`;
                tooltip.classList.add("visible");
                const crosshair = candidate.querySelector(".crosshair");
                crosshair.setAttribute(
                    "x1",
                    String(x(Number(point.dataset.index)))
                );
                crosshair.setAttribute(
                    "x2",
                    String(x(Number(point.dataset.index)))
                );
                crosshair.classList.add("active");
            };
            const hideTooltip = (point) => {
                const candidate = point.closest(".candidate");
                candidate.querySelector(".tooltip").classList.remove("visible");
                candidate
                    .querySelector(".crosshair")
                    .classList.remove("active");
            };
            const moveFocus = (point, key) => {
                const candidate = point.closest(".candidate");
                const series = Number(point.dataset.series);
                let index = Number(point.dataset.index);
                let targetSeries = series;
                if (key === "ArrowRight")
                    index = Math.min(rows.length - 1, index + 1);
                if (key === "ArrowLeft") index = Math.max(0, index - 1);
                if (key === "Home") index = 0;
                if (key === "End") index = rows.length - 1;
                if (key === "ArrowUp") targetSeries = Math.max(0, series - 1);
                if (key === "ArrowDown") targetSeries = Math.min(1, series + 1);
                candidate
                    .querySelector(
                        `[data-series="${targetSeries}"][data-index="${index}"]`
                    )
                    ?.focus();
            };
            const bindInteractions = () => {
                document.querySelectorAll(".point").forEach((point) => {
                    point.addEventListener("mouseenter", () =>
                        showTooltip(point)
                    );
                    point.addEventListener("mouseleave", () =>
                        hideTooltip(point)
                    );
                    point.addEventListener("focus", () => showTooltip(point));
                    point.addEventListener("blur", () => hideTooltip(point));
                    point.addEventListener("keydown", (event) => {
                        if (
                            [
                                "ArrowLeft",
                                "ArrowRight",
                                "ArrowUp",
                                "ArrowDown",
                                "Home",
                                "End",
                            ].includes(event.key)
                        ) {
                            event.preventDefault();
                            moveFocus(point, event.key);
                        }
                    });
                });
                document
                    .querySelectorAll("[data-table]")
                    .forEach((button) =>
                        button.addEventListener("click", () =>
                            toggleTable(button.closest(".candidate"))
                        )
                    );
                document
                    .querySelectorAll("[data-view]")
                    .forEach((button) =>
                        button.addEventListener("click", () =>
                            toggleTable(
                                button.closest(".candidate"),
                                button.dataset.view === "table"
                            )
                        )
                    );
                document
                    .querySelectorAll("[data-csv]")
                    .forEach((button) =>
                        button.addEventListener(
                            "click",
                            () =>
                                (document.querySelector("#live").textContent =
                                    copies[lang].csvStatus)
                        )
                    );
            };
            document.querySelectorAll("[data-control]").forEach((button) =>
                button.addEventListener("click", () => {
                    const control = button.dataset.control;
                    document
                        .querySelectorAll(`[data-control="${control}"]`)
                        .forEach((item) =>
                            item.setAttribute(
                                "aria-pressed",
                                String(item === button)
                            )
                        );
                    if (control === "theme")
                        document.body.classList.toggle(
                            "dark",
                            button.dataset.value === "dark"
                        );
                    if (control === "cue")
                        document.body.classList.toggle(
                            "colorless",
                            button.dataset.value === "colorless"
                        );
                })
            );
            document.querySelectorAll("[data-lang]").forEach((button) =>
                button.addEventListener("click", () => {
                    lang = button.dataset.lang;
                    document
                        .querySelectorAll("[data-lang]")
                        .forEach((item) =>
                            item.setAttribute(
                                "aria-pressed",
                                String(item === button)
                            )
                        );
                    render();
                })
            );
            if (new URLSearchParams(location.search).get("theme") === "dark") {
                document.body.classList.add("dark");
                document
                    .querySelector('[data-control="theme"][data-value="dark"]')
                    .click();
            }
            render();
        </script>
    </body>
</html>
