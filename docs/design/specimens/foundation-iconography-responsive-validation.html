<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>NosLog 2.0 Lucide Responsive Validation</title>
        <style>
            * { box-sizing: border-box; }
            :root { font-family: Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif; background: #e9e9e9; color: #292929; }
            body { margin: 0; }
            main { display: grid; gap: 16px; width: min(1280px, 100%); margin: 0 auto; padding: 16px; }
            header { border: 1px solid #c6c6c6; border-radius: 8px; padding: 16px; background: #fff; }
            h1, p { margin: 0; }
            h1 { font-size: clamp(22px, 4vw, 32px); }
            p { margin-top: 8px; color: #505050; line-height: 1.6; }
            .frames { display: flex; flex-wrap: wrap; gap: 20px; align-items: start; }
            figure { display: grid; gap: 8px; margin: 0; min-width: 0; }
            figcaption { font-size: 12px; font-weight: 800; }
            iframe { display: block; box-sizing: content-box; border: 1px solid #717171; border-radius: 8px; background: #fff; }
            @media (max-width: 520px) { main { padding: 10px; } }
        </style>
    </head>
    <body>
        <main>
            <header>
                <h1>IC-06 · Lucide responsive/localization validation</h1>
                <p>각 iframe 자체의 CSS viewport가 정확히 320px 또는 390px입니다. 선택한 Lucide card만 같은 source HTML로 render합니다.</p>
            </header>
            <section class="frames" aria-label="반응형 검증 프레임">
                <figure><figcaption>320px · 한국어 · Light</figcaption><iframe title="320px 한국어 Light" width="320" height="600" src="./foundation-iconography-source-comparison.html?embed=lucide&amp;lang=ko&amp;theme=light"></iframe></figure>
                <figure><figcaption>390px · 日本語 · Dark</figcaption><iframe title="390px 일본어 Dark" width="390" height="600" src="./foundation-iconography-source-comparison.html?embed=lucide&amp;lang=ja&amp;theme=dark"></iframe></figure>
                <figure><figcaption>390px · English · Light</figcaption><iframe title="390px 영어 Light" width="390" height="600" src="./foundation-iconography-source-comparison.html?embed=lucide&amp;lang=en&amp;theme=light"></iframe></figure>
                <figure><figcaption>390px · English · compact 16px</figcaption><iframe title="390px 영어 compact 16px" width="390" height="600" src="./foundation-iconography-source-comparison.html?embed=lucide&amp;lang=en&amp;theme=light&amp;size=compact"></iframe></figure>
            </section>
        </main>
    </body>
</html>
