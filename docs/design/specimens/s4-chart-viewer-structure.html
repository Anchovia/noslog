<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>NosLog S4 Chart Viewer Structural Specimen</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: Pretendard, "Pretendard JP", system-ui, sans-serif;
                background: #0b0b0f;
                color: #f4f4f7;
            }

            * {
                box-sizing: border-box;
            }

            [hidden] {
                display: none !important;
            }

            body {
                margin: 0;
                min-width: 320px;
                background: #0b0b0f;
            }

            button,
            select,
            input {
                font: inherit;
            }

            button,
            select,
            input[type="checkbox"] {
                cursor: pointer;
            }

            button:focus-visible,
            select:focus-visible,
            input:focus-visible {
                outline: 3px solid #f5f5f7;
                outline-offset: 2px;
            }

            .review-toolbar {
                position: sticky;
                top: 0;
                z-index: 20;
                display: flex;
                flex-wrap: wrap;
                align-items: end;
                gap: 12px;
                padding: 12px 16px;
                border-bottom: 1px solid #30303b;
                background: rgb(11 11 15 / 0.96);
            }

            .review-toolbar label {
                display: grid;
                gap: 4px;
                color: #b4b4bf;
                font-size: 12px;
                line-height: 16px;
            }

            .review-toolbar select,
            .review-toolbar button {
                min-height: 40px;
                padding: 0 12px;
                border: 1px solid #3a3a47;
                border-radius: 8px;
                color: #f4f4f7;
                background: #17171f;
            }

            .review-toolbar button {
                align-self: end;
            }

            #matrix-output {
                max-width: 420px;
                color: #9d9daa;
                font:
                    12px/16px ui-monospace,
                    SFMono-Regular,
                    Consolas,
                    monospace;
                overflow-wrap: anywhere;
            }

            .review-stage {
                padding: 24px;
                overflow-x: auto;
            }

            .viewer-frame {
                --fs-12: 12px;
                --fs-14: 14px;
                --fs-16: 16px;
                --fs-20: 20px;
                --lh-16: 16px;
                --lh-20: 20px;
                --lh-24: 24px;
                --lh-28: 28px;
                --page: #08080d;
                --surface: #111118;
                --surface-raised: #191923;
                --control: #20202b;
                --line: #30303d;
                --line-soft: #24242f;
                --text: #f2f2f5;
                --muted: #aaaab6;
                --left: #56d6e7;
                --right: #ff7b84;
                position: relative;
                width: 390px;
                max-width: none;
                min-height: 560px;
                margin: 0 auto;
                overflow: hidden;
                border: 1px solid var(--line);
                border-radius: 16px;
                background: var(--page);
                color: var(--text);
                container-name: viewer;
                container-type: inline-size;
            }

            .viewer-frame[data-text-scale="200"] {
                --fs-12: 24px;
                --fs-14: 28px;
                --fs-16: 32px;
                --fs-20: 40px;
                --lh-16: 32px;
                --lh-20: 40px;
                --lh-24: 48px;
                --lh-28: 56px;
            }

            .viewer-main {
                display: grid;
                gap: 12px;
                min-width: 0;
                padding: max(16px, env(safe-area-inset-top))
                    max(16px, env(safe-area-inset-right))
                    max(16px, env(safe-area-inset-bottom))
                    max(16px, env(safe-area-inset-left));
            }

            .focused-header {
                display: grid;
                grid-template-columns: auto minmax(0, 1fr);
                gap: 12px;
                align-items: start;
            }

            .icon-button,
            .primary-control {
                display: inline-grid;
                width: 44px;
                height: 44px;
                place-items: center;
                flex: 0 0 auto;
                padding: 0;
                border: 1px solid var(--line);
                border-radius: 10px;
                color: var(--text);
                background: var(--control);
            }

            .primary-control {
                color: #101017;
                background: #f1f1f4;
            }

            .chart-identity {
                display: grid;
                min-width: 0;
                gap: 2px;
            }

            .chart-identity strong {
                font-size: var(--fs-16);
                line-height: var(--lh-24);
                font-weight: 600;
                overflow-wrap: anywhere;
            }

            .chart-identity span,
            .chart-summary,
            .sheet-hint,
            .status-message {
                color: var(--muted);
                font-size: var(--fs-12);
                line-height: var(--lh-16);
            }

            .view-tabs {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 4px;
                padding: 4px;
                border: 1px solid var(--line);
                border-radius: 12px;
                background: var(--surface);
            }

            .view-tab {
                min-height: 44px;
                padding: 0 12px;
                border: 0;
                border-radius: 8px;
                color: var(--text);
                background: transparent;
                font-size: var(--fs-14);
                line-height: var(--lh-20);
                font-weight: 500;
            }

            .view-tab[aria-selected="true"] {
                color: #101017;
                background: #f1f1f4;
            }

            .status-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px 16px;
                flex-wrap: wrap;
            }

            .status-message {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                min-height: 32px;
            }

            .retry-button {
                min-height: 44px;
                padding: 0 12px;
                border: 1px solid var(--line);
                border-radius: 8px;
                color: var(--text);
                background: var(--control);
                font-size: var(--fs-14);
                line-height: var(--lh-20);
                font-weight: 500;
            }

            .context-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px 16px;
                flex-wrap: wrap;
            }

            .hand-legend {
                display: flex;
                gap: 12px;
                color: var(--text);
                font-size: var(--fs-12);
                line-height: var(--lh-16);
            }

            .hand-legend span {
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }

            .hand-mark {
                width: 9px;
                height: 9px;
                border-radius: 50%;
            }

            .hand-mark.left {
                background: var(--left);
            }

            .hand-mark.right {
                background: var(--right);
            }

            .view-panel[hidden] {
                display: none;
            }

            .falling-panel {
                display: grid;
                gap: 8px;
            }

            .falling-unit {
                width: min(100%, 1024px);
                margin: 0 auto;
            }

            .renderer {
                height: clamp(236px, 48svh, 560px);
                overflow: hidden;
                border: 1px solid var(--line);
                border-bottom: 0;
                border-radius: 14px 14px 0 0;
                background: var(--surface);
            }

            .renderer svg {
                display: block;
                width: 100%;
                height: 100%;
            }

            .lane-path {
                fill: none;
                stroke: var(--line-soft);
                stroke-width: 2;
            }

            .trail-left {
                fill: rgb(86 214 231 / 0.3);
                stroke: var(--left);
                stroke-width: 2;
            }

            .trail-right {
                fill: rgb(255 123 132 / 0.3);
                stroke: var(--right);
                stroke-width: 2;
            }

            .note-left,
            .note-right {
                fill: var(--surface);
                stroke-width: 3;
            }

            .note-left {
                stroke: var(--left);
            }

            .note-right {
                stroke: var(--right);
            }

            .judge-line {
                stroke: var(--muted);
                stroke-width: 4;
            }

            .white-keys {
                fill: #e5e5e7;
                stroke: #9d9da6;
            }

            .black-key {
                fill: #141419;
            }

            .renderer-state {
                display: grid;
                min-height: 100%;
                place-items: center;
                padding: 24px;
                color: var(--muted);
                font-size: var(--fs-14);
                line-height: var(--lh-20);
                text-align: center;
            }

            .transport {
                display: grid;
                grid-template-columns:
                    auto auto minmax(72px, 1fr)
                    auto auto auto;
                align-items: center;
                gap: 6px;
                padding: 8px;
                border: 1px solid var(--line);
                border-radius: 0 0 14px 14px;
                background: var(--surface);
            }

            .seek-control {
                display: flex;
                align-items: center;
                min-width: 0;
                min-height: 44px;
            }

            .seek-control input,
            .volume-control input {
                width: 100%;
                accent-color: #f1f1f4;
            }

            .time-value {
                color: var(--text);
                font-size: var(--fs-14);
                line-height: var(--lh-20);
                font-weight: 500;
                font-variant-numeric: tabular-nums;
                white-space: nowrap;
            }

            .fast-controls {
                display: flex;
                justify-content: flex-start;
                gap: 8px;
                flex-wrap: wrap;
            }

            .fast-control,
            .switch-control {
                display: flex;
                min-height: 44px;
                align-items: center;
                gap: 8px;
                padding: 0 12px;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: var(--surface);
                color: var(--text);
                font-size: var(--fs-14);
                line-height: var(--lh-20);
            }

            .fast-control select {
                min-width: 76px;
                min-height: 44px;
                border: 0;
                color: var(--text);
                background: transparent;
            }

            .switch-control input {
                width: 20px;
                height: 20px;
                accent-color: #f1f1f4;
            }

            .sheet-panel {
                min-width: 0;
                overflow: hidden;
            }

            .sheet-hint {
                margin: 0 0 8px;
            }

            .sheet-region {
                width: 100%;
                max-width: 100%;
                min-width: 0;
                overflow-x: auto;
                overscroll-behavior-inline: contain;
                scrollbar-width: thin;
                scroll-snap-type: inline proximity;
            }

            .sheet-track {
                display: grid;
                grid-template-columns: repeat(4, 276px);
                gap: 12px;
                width: max-content;
            }

            .sheet-column {
                padding: 10px;
                border: 1px solid var(--line);
                border-radius: 12px;
                background: var(--surface);
                scroll-snap-align: start;
            }

            .sheet-column > span {
                display: block;
                margin-bottom: 8px;
                color: var(--muted);
                font-size: var(--fs-12);
                line-height: var(--lh-16);
            }

            .sheet-grid {
                position: relative;
                height: 360px;
                overflow: hidden;
                border-top: 1px solid var(--line);
                border-bottom: 1px solid var(--line);
                background:
                    repeating-linear-gradient(
                        to right,
                        transparent 0 8px,
                        var(--line-soft) 8px 9px
                    ),
                    repeating-linear-gradient(
                        to bottom,
                        transparent 0 88px,
                        var(--line-soft) 88px 89px
                    );
            }

            .sheet-note {
                position: absolute;
                display: block;
                height: 9px;
                border-radius: 4px;
            }

            .sheet-note.left {
                width: 54px;
                background: var(--left);
            }

            .sheet-note.right {
                width: 46px;
                background: var(--right);
            }

            .sheet-note.a {
                top: 48px;
                left: 20px;
            }

            .sheet-note.b {
                top: 132px;
                left: 76px;
            }

            .sheet-note.c {
                top: 218px;
                right: 66px;
            }

            .sheet-note.d {
                top: 306px;
                right: 18px;
            }

            .report-action,
            .text-action {
                justify-self: start;
                min-height: 44px;
                padding: 0;
                border: 0;
                color: var(--muted);
                background: transparent;
                font-size: var(--fs-14);
                line-height: var(--lh-20);
                text-decoration: underline;
                text-underline-offset: 3px;
            }

            .settings-layer {
                position: absolute;
                inset: 0;
                z-index: 10;
                display: flex;
                align-items: flex-end;
                min-width: 0;
                padding: 12px;
                background: rgb(0 0 0 / 0.58);
            }

            .settings-layer[hidden] {
                display: none;
            }

            .settings-panel {
                display: grid;
                width: 100%;
                min-width: 0;
                gap: 12px;
                padding: 16px;
                border: 1px solid var(--line);
                border-radius: 16px;
                background: var(--surface-raised);
                box-shadow: 0 18px 44px rgb(0 0 0 / 0.5);
            }

            .settings-heading {
                display: flex;
                align-items: center;
                justify-content: space-between;
                min-width: 0;
                gap: 12px;
            }

            .settings-heading strong {
                min-width: 0;
                font-size: var(--fs-16);
                line-height: var(--lh-24);
                font-weight: 600;
                overflow-wrap: anywhere;
            }

            .file-control,
            .volume-control {
                display: grid;
                min-width: 0;
                gap: 8px;
                color: var(--text);
                font-size: var(--fs-14);
                line-height: var(--lh-20);
            }

            .file-control input {
                width: 100%;
                min-width: 0;
                min-height: 44px;
                max-width: 100%;
            }

            .volume-control input {
                min-width: 0;
            }

            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
                border: 0;
            }

            @container viewer (max-width: 419px) {
                .viewer-main {
                    gap: 8px;
                }

                .transport {
                    grid-template-columns: auto auto minmax(52px, 1fr) auto;
                }

                .seek-control {
                    grid-column: 3;
                }

                .time-value {
                    grid-column: 3;
                    grid-row: 2;
                }

                .fullscreen-control {
                    display: none;
                }

                .fast-control,
                .switch-control {
                    flex: 1 1 auto;
                }
            }

            @container viewer (min-width: 720px) {
                .viewer-main {
                    gap: 16px;
                    padding: max(24px, env(safe-area-inset-top))
                        max(32px, env(safe-area-inset-right))
                        max(24px, env(safe-area-inset-bottom))
                        max(32px, env(safe-area-inset-left));
                }

                .chart-identity {
                    grid-template-columns: minmax(0, 1fr) auto auto;
                    align-items: center;
                    gap: 16px;
                }

                .view-tabs {
                    width: min(100%, 360px);
                    margin: 0 auto;
                }

                .falling-panel {
                    min-width: 0;
                }

                .context-row,
                .falling-unit,
                .fast-controls {
                    width: min(100%, 1024px);
                    margin-right: auto;
                    margin-left: auto;
                }

                .fast-controls {
                    justify-content: flex-end;
                }

                .settings-layer {
                    align-items: flex-start;
                    justify-content: flex-end;
                    padding-top: 152px;
                }

                .settings-panel {
                    width: min(360px, 100%);
                }

                .sheet-hint {
                    display: none;
                }
            }

            .viewer-frame[data-text-scale="200"] .transport {
                grid-template-columns: auto auto minmax(88px, 1fr) auto;
            }

            .viewer-frame[data-text-scale="200"] .seek-control {
                grid-column: 1 / -1;
                grid-row: 2;
            }

            .viewer-frame[data-text-scale="200"] .time-value {
                grid-column: 1 / -1;
                grid-row: 3;
            }

            .viewer-frame[data-text-scale="200"] .fast-controls {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
            }

            .viewer-frame[data-text-scale="200"] .fast-control,
            .viewer-frame[data-text-scale="200"] .switch-control {
                width: 100%;
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    scroll-behavior: auto !important;
                    transition-duration: 0.01ms !important;
                }
            }
        </style>
    </head>
    <body>
        <form class="review-toolbar" aria-label="S4 specimen controls">
            <label>
                Width
                <select id="width-control">
                    <option value="320">320</option>
                    <option value="360">360</option>
                    <option value="390" selected>390</option>
                    <option value="430">430</option>
                    <option value="672">672</option>
                    <option value="1056">1056</option>
                    <option value="1280">1280</option>
                    <option value="1440">1440</option>
                </select>
            </label>
            <label>
                Locale
                <select id="locale-control">
                    <option value="ko" selected>한국어</option>
                    <option value="ja">日本語</option>
                    <option value="en">English</option>
                </select>
            </label>
            <label>
                Text
                <select id="scale-control">
                    <option value="100" selected>100%</option>
                    <option value="200">200%</option>
                </select>
            </label>
            <label>
                State
                <select id="state-control">
                    <option value="ready" selected>Ready</option>
                    <option value="loading">Loading</option>
                    <option value="empty">No notes</option>
                    <option value="falling-error">Falling error</option>
                    <option value="fullscreen-error">Fullscreen error</option>
                    <option value="audio-error">Local audio error</option>
                </select>
            </label>
            <button type="button" id="settings-demo">Open settings</button>
            <button type="button" id="matrix-run">Run matrix</button>
            <output id="matrix-output" aria-live="polite"></output>
        </form>

        <div class="review-stage">
            <div class="viewer-frame" id="viewer-frame" data-text-scale="100">
                <main class="viewer-main">
                    <header class="focused-header">
                        <button
                            type="button"
                            class="icon-button"
                            id="back-button"
                            aria-label="악곡 상세로 돌아가기"
                        >
                            ←
                        </button>
                        <div class="chart-identity">
                            <strong id="music-title">Altale</strong>
                            <span id="music-artist"
                                >Feryquitous · Real Lv 2</span
                            >
                            <span id="music-summary">232 노트 · 2:32</span>
                        </div>
                    </header>

                    <div
                        class="view-tabs"
                        role="tablist"
                        aria-label="채보 보기"
                        id="view-tabs"
                    >
                        <button
                            type="button"
                            class="view-tab"
                            id="falling-tab"
                            role="tab"
                            aria-selected="true"
                            aria-controls="falling-panel"
                            data-view="falling"
                        >
                            낙하형
                        </button>
                        <button
                            type="button"
                            class="view-tab"
                            id="sheet-tab"
                            role="tab"
                            aria-selected="false"
                            aria-controls="sheet-panel"
                            data-view="sheet"
                        >
                            전체 채보
                        </button>
                    </div>

                    <div class="status-row" id="status-row" hidden>
                        <span
                            class="status-message"
                            role="status"
                            id="status-message"
                        ></span>
                        <button
                            type="button"
                            class="retry-button"
                            id="retry-button"
                            hidden
                        >
                            다시 시도
                        </button>
                    </div>

                    <div class="context-row">
                        <div class="hand-legend" aria-label="손 안내">
                            <span
                                ><i
                                    class="hand-mark left"
                                    aria-hidden="true"
                                ></i
                                ><span id="left-label">왼손</span></span
                            >
                            <span
                                ><i
                                    class="hand-mark right"
                                    aria-hidden="true"
                                ></i
                                ><span id="right-label">오른손</span></span
                            >
                        </div>
                        <span class="chart-summary">28 lanes · BPM 90</span>
                    </div>

                    <section
                        class="view-panel falling-panel"
                        id="falling-panel"
                        role="tabpanel"
                        aria-labelledby="falling-tab"
                    >
                        <div
                            class="falling-unit"
                            role="group"
                            aria-label="낙하형 채보 플레이어"
                        >
                            <div
                                class="renderer"
                                id="renderer"
                                role="img"
                                aria-label="28레인 낙하형 채보"
                            >
                                <svg
                                    viewBox="0 0 640 420"
                                    aria-hidden="true"
                                    preserveAspectRatio="none"
                                >
                                    <g>
                                        <path
                                            class="lane-path"
                                            d="M65 320 Q94 116 176 26"
                                        ></path>
                                        <path
                                            class="lane-path"
                                            d="M133 320 Q155 116 224 26"
                                        ></path>
                                        <path
                                            class="lane-path"
                                            d="M201 320 Q217 116 272 26"
                                        ></path>
                                        <path
                                            class="lane-path"
                                            d="M269 320 Q278 116 308 26"
                                        ></path>
                                        <path
                                            class="lane-path"
                                            d="M337 320 Q330 116 332 26"
                                        ></path>
                                        <path
                                            class="lane-path"
                                            d="M405 320 Q391 116 368 26"
                                        ></path>
                                        <path
                                            class="lane-path"
                                            d="M473 320 Q452 116 416 26"
                                        ></path>
                                        <path
                                            class="lane-path"
                                            d="M541 320 Q512 116 464 26"
                                        ></path>
                                    </g>
                                    <path
                                        class="trail-left"
                                        d="M118 320 C128 260 142 206 156 150 C162 124 170 95 182 62 L218 62 C208 99 198 129 192 156 C179 213 171 267 170 320 Z"
                                    ></path>
                                    <path
                                        class="trail-left"
                                        d="M224 320 C225 268 229 221 237 175 L274 175 C267 222 267 271 276 320 Z"
                                    ></path>
                                    <path
                                        class="trail-right"
                                        d="M418 320 C420 266 417 205 409 132 L447 132 C461 207 468 267 471 320 Z"
                                    ></path>
                                    <path
                                        class="trail-right"
                                        d="M506 320 C495 252 482 187 465 100 L503 100 C526 188 541 256 552 320 Z"
                                    ></path>
                                    <rect
                                        class="note-left"
                                        x="151"
                                        y="144"
                                        width="48"
                                        height="11"
                                        rx="4"
                                    ></rect>
                                    <rect
                                        class="note-left"
                                        x="185"
                                        y="83"
                                        width="48"
                                        height="11"
                                        rx="4"
                                    ></rect>
                                    <rect
                                        class="note-right"
                                        x="404"
                                        y="126"
                                        width="48"
                                        height="11"
                                        rx="4"
                                    ></rect>
                                    <rect
                                        class="note-right"
                                        x="458"
                                        y="94"
                                        width="48"
                                        height="11"
                                        rx="4"
                                    ></rect>

                        audioError:
                            "ローカル音源を使用できません。譜面のみの再生は継続できます。",
                        retry: "再試行",
                    },
                    en: {
                        back: "Return to Music detail",
                        title: "Symphony No. 9 in E Minor, Op. 95, From the New World",
                        artist: "Antonín Dvořák · arranged by BEMANI Sound Team · Real Lv 2",
                        summary: "232 notes · 2:32",
                        falling: "Falling",
                        sheet: "Full sheet",
                        left: "Left hand",
                        right: "Right hand",
                        speed: "Note speed",
                        metronome: "Metronome",
                        report: "Report a chart issue",
                        settings: "Playback settings",
                        closeSettings: "Close playback settings",
                        audio: "Local audio",
                        volume: "Metronome volume · 80%",
                        strict: "Strict performance",
                        shortcuts: "View keyboard shortcuts",
                        hint: "Move horizontally to view the next column",
                        loading: "Preparing the Falling chart",
                        empty: "No notes to display",
                        fallingError:
                            "Falling view could not be displayed. Full sheet remains usable.",
                        fullscreenError:
                            "Fullscreen could not be opened. The current viewer remains usable.",
                        audioError:
                            "Local audio could not be used. Chart-only playback continues.",
                        retry: "Retry",
                    },
                };

                let activeView = "falling";

                function setView(view, focus = false) {
                    activeView = view;
                    tabs.forEach((tab) => {
                        const selected = tab.dataset.view === view;
                        tab.setAttribute("aria-selected", String(selected));
                        tab.tabIndex = selected ? 0 : -1;
                        if (selected && focus) tab.focus();
                    });
                    panels.falling.hidden = view !== "falling";
                    panels.sheet.hidden = view !== "sheet";
                }

                function applyLocale(locale) {
                    const text = copy[locale];
                    document.documentElement.lang = locale;
                    document.getElementById("back-button").ariaLabel =
                        text.back;
                    document.getElementById("music-title").textContent =
                        text.title;
                    document.getElementById("music-artist").textContent =
                        text.artist;
                    document.getElementById("music-summary").textContent =
                        text.summary;
                    document.getElementById("falling-tab").textContent =
                        text.falling;
                    document.getElementById("sheet-tab").textContent =
                        text.sheet;
                    document.getElementById("left-label").textContent =
                        text.left;
                    document.getElementById("right-label").textContent =
                        text.right;
                    document.getElementById("speed-label").textContent =
                        text.speed;
                    document.getElementById("metronome-label").textContent =
                        text.metronome;
                    document.getElementById("report-action").textContent =
                        text.report;
                    document.getElementById("settings-title").textContent =
                        text.settings;
                    document.getElementById("settings-close").ariaLabel =
                        text.closeSettings;
                    document.getElementById("audio-label").textContent =
                        text.audio;
                    document.getElementById("volume-label").textContent =
                        text.volume;
                    document.getElementById("strict-label").textContent =
                        text.strict;
                    document.getElementById("shortcut-action").textContent =
                        text.shortcuts;
                    document.getElementById("sheet-hint").textContent =
                        text.hint;
                    document.getElementById("retry-button").textContent =
                        text.retry;
                }

                function applyState(state) {
                    const text = copy[controls.locale.value];
                    statusRow.hidden = true;
                    retryButton.hidden = true;
                    audioStatus.hidden = true;
                    renderer.innerHTML = rendererMarkup;
                    renderer.removeAttribute("aria-busy");
                    renderer.setAttribute("role", "img");
                    renderer.setAttribute(
                        "aria-label",
                        "28-lane Falling chart"
                    );

                    if (state === "loading") {
                        setView("falling");
                        renderer.setAttribute("aria-busy", "true");
                        renderer.innerHTML = `<div class="renderer-state">${text.loading}</div>`;
                    }
                    if (state === "empty") {
                        renderer.innerHTML = `<div class="renderer-state">${text.empty}</div>`;
                    }
                    if (state === "falling-error") {
                        setView("sheet");
                        statusRow.hidden = false;
                        statusMessage.textContent = text.fallingError;
                        retryButton.hidden = false;
                    }
                    if (state === "fullscreen-error") {
                        setView("falling");
                        statusRow.hidden = false;
                        statusMessage.textContent = text.fullscreenError;
                    }
                    if (state === "audio-error") {
                        setView("falling");
                        audioStatus.hidden = false;
                        audioStatus.textContent = text.audioError;
                    }
                }

                function openSettings() {
                    settingsLayer.hidden = false;
                    settingsButton.setAttribute("aria-expanded", "true");
                    settingsClose.focus();
                }

                function closeSettings() {
                    settingsLayer.hidden = true;
                    settingsButton.setAttribute("aria-expanded", "false");
                    settingsButton.focus();
                }

                function sync() {
                    frame.style.width = `${controls.width.value}px`;
                    frame.dataset.textScale = controls.scale.value;
                    applyLocale(controls.locale.value);
                    applyState(controls.state.value);
                }

                tabs.forEach((tab, index) => {
                    tab.addEventListener("click", () =>
                        setView(tab.dataset.view)
                    );
                    tab.addEventListener("keydown", (event) => {
                        if (
                            event.key === "ArrowLeft" ||
                            event.key === "ArrowRight"
                        ) {
                            event.preventDefault();
                            const delta = event.key === "ArrowRight" ? 1 : -1;
                            const target =
                                tabs[
                                    (index + delta + tabs.length) % tabs.length
                                ];
                            target.focus();
                        }
                        if (
                            (event.key === "Enter" || event.key === " ") &&
                            tab.getAttribute("aria-selected") !== "true"
                        ) {
                            event.preventDefault();
                            setView(tab.dataset.view, true);
                        }
                    });
                });

                Object.values(controls).forEach((control) =>
                    control.addEventListener("change", sync)
                );
                document
                    .getElementById("settings-demo")
                    .addEventListener("click", openSettings);
                document
                    .getElementById("matrix-run")
                    .addEventListener("click", () => {
                        const result = runMatrix();
                        document.getElementById("matrix-output").textContent =
                            JSON.stringify({
                                cases: result.cases,
                                failureCount: result.failures.length,
                                checks: result.checks,
                                failures: result.failures.slice(0, 12),
                            });
                    });
                settingsButton.addEventListener("click", openSettings);
                settingsClose.addEventListener("click", closeSettings);
                settingsLayer.addEventListener("click", (event) => {
                    if (event.target === settingsLayer) closeSettings();
                });
                document.addEventListener("keydown", (event) => {
                    if (event.key === "Escape" && !settingsLayer.hidden)
                        closeSettings();
                });
                retryButton.addEventListener("click", () => {
                    controls.state.value = "ready";
                    setView("falling");
                    sync();
                });

                function inspectCase() {
                    const frameRect = frame.getBoundingClientRect();
                    const rendererRect = renderer.getBoundingClientRect();
                    const transport = document.querySelector(".transport");
                    const transportRect = transport.getBoundingClientRect();
                    const interactive = Array.from(
                        frame.querySelectorAll(
                            "button:not([hidden]), select:not([hidden])"
                        )
                    ).filter((element) => element.offsetParent !== null);
                    const smallTargets = interactive
                        .map((element) => ({
                            name:
                                element.getAttribute("aria-label") ||
                                element.textContent.trim(),
                            width: element.getBoundingClientRect().width,
                            height: element.getBoundingClientRect().height,
                        }))
                        .filter(
                            (target) =>
                                target.width < 43.5 || target.height < 43.5
                        );
                    const sheetRegion = document.querySelector(".sheet-region");
                    const overflowContainers = Array.from(
                        frame.querySelectorAll("*")
                    )
                        .filter(
                            (element) =>
                                element.offsetParent !== null &&
                                element.scrollWidth > element.clientWidth + 1
                        )
                        .map((element) => ({
                            name:
                                element.id ||
                                element.className ||
                                element.tagName,
                            clientWidth: element.clientWidth,
                            scrollWidth: element.scrollWidth,
                        }));
                    return {
                        width: controls.width.value,
                        locale: controls.locale.value,
                        scale: controls.scale.value,
                        state: controls.state.value,
                        view: activeView,
                        frameOverflow:
                            frame.scrollWidth > frame.clientWidth + 1,
                        overflowContainers,
                        attachedTransport:
                            Math.abs(transportRect.top - rendererRect.bottom) <=
                            1.5,
                        smallTargets,
                        sheetLocalOverflow:
                            activeView === "sheet"
                                ? sheetRegion.scrollWidth >
                                  sheetRegion.clientWidth
                                : null,
                        settingsContained:
                            settingsLayer.hidden ||
                            (document
                                .querySelector(".settings-panel")
                                .getBoundingClientRect().left >=
                                frameRect.left &&
                                document
                                    .querySelector(".settings-panel")
                                    .getBoundingClientRect().right <=
                                    frameRect.right),
                        settingsOpen: !settingsLayer.hidden,
                    };
                }

                function runMatrix() {
                    const widths = [320, 360, 390, 430, 672, 1056, 1280, 1440];
                    const locales = ["ko", "ja", "en"];
                    const scales = ["100", "200"];
                    const states = [
                        "ready",
                        "loading",
                        "empty",
                        "falling-error",
                        "fullscreen-error",
                        "audio-error",
                    ];
                    const views = ["falling", "sheet"];
                    const results = [];

                    closeSettings();
                    for (const width of widths) {
                        controls.width.value = String(width);
                        for (const locale of locales) {
                            controls.locale.value = locale;
                            for (const scale of scales) {
                                controls.scale.value = scale;
                                for (const state of states) {
                                    controls.state.value = state;
                                    sync();
                                    for (const view of views) {
                                        if (state !== "falling-error")
                                            setView(view);
                                        results.push(inspectCase());
                                        if (state === "falling-error") break;
                                    }
                                }

                                controls.state.value = "ready";
                                sync();
                                setView("falling");
                                openSettings();
                                results.push(inspectCase());
                                closeSettings();
                            }
                        }
                    }

                    controls.width.value = "390";
                    controls.locale.value = "ko";
                    controls.scale.value = "100";
                    controls.state.value = "ready";
                    sync();
                    setView("falling");

                    const failures = results.filter(
                        (result) =>
                            result.frameOverflow ||
                            !result.attachedTransport ||
                            result.smallTargets.length > 0 ||
                            !result.settingsContained ||
                            (result.view === "sheet" &&
                                !result.settingsOpen &&
                                Number(result.width) <= 430 &&
                                result.sheetLocalOverflow !== true) ||
                            (result.view === "sheet" &&
                                !result.settingsOpen &&
                                Number(result.width) >= 1280 &&
                                result.sheetLocalOverflow !== false)
                    );
                    const checks = {
                        fallingCases: results.filter(
                            (result) =>
                                result.view === "falling" &&
                                !result.settingsOpen
                        ).length,
                        sheetCases: results.filter(
                            (result) =>
                                result.view === "sheet" && !result.settingsOpen
                        ).length,
                        settingsCases: results.filter(
                            (result) => result.settingsOpen
                        ).length,
                        compactSheetUsesLocalOverflow: results
                            .filter(
                                (result) =>
                                    result.view === "sheet" &&
                                    !result.settingsOpen &&
                                    Number(result.width) <= 430
                            )
                            .every(
                                (result) => result.sheetLocalOverflow === true
                            ),
                        wideSheetFitsWithoutOverflow: results
                            .filter(
                                (result) =>
                                    result.view === "sheet" &&
                                    !result.settingsOpen &&
                                    Number(result.width) >= 1280
                            )
                            .every(
                                (result) => result.sheetLocalOverflow === false
                            ),
                    };
                    return { cases: results.length, failures, results, checks };
                }

                sync();
                setView("falling");
                return {
                    frame,
                    controls,
                    setView,
                    openSettings,
                    closeSettings,
                    inspectCase,
                    runMatrix,
                };
            })();

            window.s4Specimen = specimen;
        </script>
    </body>
</html>
