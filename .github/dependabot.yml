# 의존성 갱신 PR 을 주 1회 묶어서 연다(2026-10-15 CI 정비). 병합 여부는 사용자가 정한다.
# 새 버전은 14일이 지나야 제안한다 — 막 나온 버전의 공급망 사고를 피한다.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
      cooldown:
          default-days: 14
      open-pull-requests-limit: 3
      groups:
          npm-minor-patch:
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
      cooldown:
          default-days: 14
      groups:
          actions:
              patterns:
                  - "*"
