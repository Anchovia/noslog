name: UI·접근성 개선
description: 화면·공용 부품·반응형·접근성의 문제와 개선 범위를 정리합니다.
title: "[Design] "
body:
    - type: markdown
      attributes:
          value: |
              기존 디자인 가이드와 다른 결정이 필요하면 비교 시안과 선택 결과를 적어주세요. 색·크기·움직임을 임의로 바꾸지 않습니다.
    - type: textarea
      id: problem
      attributes:
          label: 문제와 필요한 이유
      validations:
          required: true
    - type: textarea
      id: scope
      attributes:
          label: 작업 범위와 보존 조건
          description: 대상 파일·화면과 유지해야 할 동작을 적어주세요.
      validations:
          required: true
    - type: textarea
      id: acceptance
      attributes:
          label: 완료 조건과 검증
          description: 확인 가능한 결과, 검사 명령, 관련 화면 폭·언어·권한을 적어주세요.
      validations:
          required: true
    - type: textarea
      id: reference
      attributes:
          label: 관련 문서·이슈·예시
