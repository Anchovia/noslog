name: 개발 환경·CI
description: 설정·패키지·편집기·CI 개선을 정리합니다.
title: "[Chore] "
body:
    - type: markdown
      attributes:
          value: |
              의존성 버전·호환성·lockfile·빌드 영향과 검증 명령을 적어주세요. 비밀값은 포함하지 않습니다.
    - type: textarea
      id: problem
      attributes:
          label: 문제와 필요한 이유
      validations:
          required: true
    - type: textarea
      id: scope
      attributes:
          label: 작업 범위와 보존 조건
          description: 대상 파일·화면과 유지해야 할 동작을 적어주세요.
      validations:
          required: true
    - type: textarea
      id: acceptance
      attributes:
          label: 완료 조건과 검증
          description: 확인 가능한 결과, 검사 명령, 관련 화면 폭·언어·권한을 적어주세요.
      validations:
          required: true
    - type: textarea
      id: reference
      attributes:
          label: 관련 문서·이슈·예시
