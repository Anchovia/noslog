name: 개발 환경·CI
description: 설정·패키지·편집기·CI 개선을 정리합니다.
title: "[Chore] "
body:
    - type: markdown
      attributes:
          value: |
              의존성 버전·호환성·lockfile·빌드 영향과 검증 명령을 적어주세요. 비밀값은 포함하지 않습니다.
    - type: textarea
      id: problem
      attributes:
          label: 문제와 필요한 이유
          placeholder: |
              공개 라우트와 lib의 import/export 정렬이 자동 검사 범위 밖입니다.
      validations:
          required: true
    - type: textarea
      id: scope
      attributes:
          label: 작업 범위와 보존 조건
          description: 대상 파일·화면과 유지해야 할 동작을 적어주세요.
          placeholder: |
              설정: eslint.config.mjs 정렬 범위 보강
              보존: 관리자·에디터 검사 범위와 기존 Node/npm 버전
              의존성 변경 여부: 없음 / 변경 시 사전 승인·버전·lockfile 영향
              환경 변수: 이름·필수 여부만; 실제 값 첨부 금지
      validations:
          required: true
    - type: textarea
      id: acceptance
      attributes:
          label: 완료 조건과 검증
          description: 확인 가능한 결과, 검사 명령, 관련 화면 폭·언어·권한을 적어주세요.
          placeholder: |
              npm run lint / npm run typecheck / npm test
              빌드·환경·의존성에 영향이 있으면 npm run build
              로컬·CI 실행 환경과 캐시/생성 파일 영향을 확인
              실행한 검사와 미실행 검사·이유를 구분
      validations:
          required: true
    - type: textarea
      id: reference
      attributes:
          label: 관련 문서·이슈·예시
          placeholder: |
              package.json / README / eslint.config.mjs / 해당 CI 작업
