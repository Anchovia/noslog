name: 데이터 정정
description: 악곡, 검정, 빙고, 서열표 등의 잘못된 데이터를 제보합니다.
title: "[Data] "
body:
    - type: dropdown
      id: category
      attributes:
          label: 데이터 종류
          options:
              - 악곡 / 채보
              - 검정
              - 빙고
              - 서열표
              - 오락실
              - 기타
      validations:
          required: true

    - type: input
      id: target
      attributes:
          label: 대상
          description: 곡명, 검정명, 빙고명 등 수정할 대상을 적어주세요.
      validations:
          required: true

    - type: textarea
      id: current
      attributes:
          label: 현재 데이터
          description: NosLog에 지금 어떻게 표시되는지 적어주세요.
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: 올바른 데이터
          description: 수정되어야 할 값을 적어주세요.
      validations:
          required: true

    - type: input
      id: source
      attributes:
          label: 확인 가능한 출처
          description: 공식 페이지 등 내용을 확인할 수 있는 URL을 입력해주세요.
          placeholder: https://...
      validations:
          required: true

    - type: textarea
      id: evidence
      attributes:
          label: 추가 자료
          description: 필요한 경우 스크린샷이나 부가 설명을 첨부해주세요.
