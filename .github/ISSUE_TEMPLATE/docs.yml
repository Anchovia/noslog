name: 문서 개선
description: 현재 코드·제품 규칙에 맞게 문서를 개선합니다.
title: "[Docs] "
body:
    - type: markdown
      attributes:
          value: |
              문서의 원본과 중복 여부를 확인하고, 폐기된 문서를 현재 요구사항으로 되살리지 않습니다.
    - type: textarea
      id: problem
      attributes:
          label: 문제와 필요한 이유
          placeholder: |
              공용 부품의 실제 ref 대상과 Props 기본값이 사용 문서에 없습니다.
      validations:
          required: true
    - type: textarea
      id: scope
      attributes:
          label: 작업 범위와 보존 조건
          description: 대상 파일·화면과 유지해야 할 동작을 적어주세요.
          placeholder: |
              원본: components/ui의 타입·구현
              갱신: docs/ui/contracts.md; 디자인 값은 docs/design/README.md 링크
              중복: AGENTS.md에는 규칙을 복사하지 않고 원본 링크만 유지
              예제: 실제 import 경로·존재하는 Props·번역 키 사용
      validations:
          required: true
    - type: textarea
      id: acceptance
      attributes:
          label: 완료 조건과 검증
          description: 확인 가능한 결과, 검사 명령, 관련 화면 폭·언어·권한을 적어주세요.
          placeholder: |
              링크·앵커·파일 참조가 실제 대상으로 연결됨
              예제 코드의 Props·기본값·명령을 현재 소스/package.json과 대조
              화면/이미지 예시는 현재 구현과 같은 상태인지 확인
              npx prettier --check <수정 문서>
              확인하지 못한 예제·명령은 미확인으로 기록
      validations:
          required: true
    - type: textarea
      id: reference
      attributes:
          label: 관련 문서·이슈·예시
          placeholder: |
              원본 코드 경로·현행 가이드 절·현재 README 설치/실행 명령
