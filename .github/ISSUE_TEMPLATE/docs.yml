name: 문서 개선
description: 현재 코드·제품 규칙에 맞게 문서를 개선합니다.
title: "[Docs] "
body:
    - type: markdown
      attributes:
          value: |
              문서의 원본과 중복 여부를 확인하고, 폐기된 문서를 현재 요구사항으로 되살리지 않습니다.
    - type: textarea
      id: problem
      attributes:
          label: 문제와 필요한 이유
      validations:
          required: true
    - type: textarea
      id: scope
      attributes:
          label: 작업 범위와 보존 조건
          description: 대상 파일·화면과 유지해야 할 동작을 적어주세요.
      validations:
          required: true
    - type: textarea
      id: acceptance
      attributes:
          label: 완료 조건과 검증
          description: 확인 가능한 결과, 검사 명령, 관련 화면 폭·언어·권한을 적어주세요.
      validations:
          required: true
    - type: textarea
      id: reference
      attributes:
          label: 관련 문서·이슈·예시
