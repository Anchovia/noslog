name: 리팩터링
description: 기존 동작을 유지하는 코드 구조·참조 경계 개선입니다.
title: "[Refactor] "
body:
    - type: markdown
      attributes:
          value: |
              기존 동작·외부 API·데이터 의미의 보존 조건과 영향받는 import를 적어주세요.
    - type: textarea
      id: problem
      attributes:
          label: 문제와 필요한 이유
          placeholder: |
              동일한 버튼 모양 링크 조합이 여러 화면에 반복되어 Props와 ref 계약을 따로 관리합니다.
      validations:
          required: true
    - type: textarea
      id: scope
      attributes:
          label: 작업 범위와 보존 조건
          description: 대상 파일·화면과 유지해야 할 동작을 적어주세요.
          placeholder: |
              Before: Link/a와 foundationButtonClass를 각각 조합
              After: ButtonLink에서 같은 클래스를 재사용
              보존: 공개 URL, OAuth 문서 이동, 북마클릿 ref, 높이·간격·키보드 동작
              영향: 직접 import와 스토리·테스트·문서 참조
      validations:
          required: true
    - type: textarea
      id: acceptance
      attributes:
          label: 완료 조건과 검증
          description: 확인 가능한 결과, 검사 명령, 관련 화면 폭·언어·권한을 적어주세요.
          placeholder: |
              동작·스타일 비교: 기존 className과 href/ref/target/rel 동일
              검사: npm run typecheck / npm run lint / npm test / npm run test:storybook
              구조 변경: npm run build
              캐시 변경이 있으면 영향 키·태그·경로와 목록/상세/홈 갱신 검증
      validations:
          required: true
    - type: textarea
      id: reference
      attributes:
          label: 관련 문서·이슈·예시
          placeholder: |
              docs/code-style.md / docs/ui/contracts.md / 관련 컴포넌트 스토리
