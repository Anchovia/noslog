name: 기능 제안
description: 새로운 기능이나 사용성 개선을 제안합니다.
title: "[Feature] "
labels:
    - enhancement
body:
    - type: textarea
      id: background
      attributes:
          label: 필요한 이유
          description: 현재 어떤 점이 불편하거나 부족한지 설명해주세요.
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: 제안 내용
          description: 원하는 동작이나 화면을 구체적으로 적어주세요.
      validations:
          required: true

    - type: textarea
      id: reference
      attributes:
          label: 참고 자료
          description: 비슷한 서비스, 이미지 또는 관련 URL이 있다면 첨부해주세요.
