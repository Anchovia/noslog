name: 버그 제보
description: 화면 오류나 정상적으로 동작하지 않는 기능을 제보합니다.
title: "[Bug] "
labels:
    - bug
body:
    - type: markdown
      attributes:
          value: |
              문제를 재현할 수 있도록 아래 항목을 작성해주세요. 계정 토큰이나 개인정보는 첨부하지 마세요.

    - type: textarea
      id: problem
      attributes:
          label: 문제 내용
          description: 무엇이 잘못되었는지 간단히 설명해주세요.
          placeholder: 어떤 화면에서 어떤 문제가 발생했는지 적어주세요.
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: 재현 방법
          description: 문제가 발생하기까지의 순서를 적어주세요.
          placeholder: |
              1. 악곡 페이지로 이동
              2. 필터에서 Real 선택
              3. ...
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: 기대한 동작
          placeholder: 원래 어떻게 동작해야 하는지 적어주세요.
      validations:
          required: true

    - type: input
      id: page
      attributes:
          label: 발생 페이지
          description: 가능하면 문제가 발생한 URL을 입력해주세요.
          placeholder: https://noslog.app/music/...

    - type: dropdown
      id: device
      attributes:
          label: 환경
          options:
              - PC
              - Android
              - iPhone / iPad
              - 기타
      validations:
          required: true

    - type: input
      id: browser
      attributes:
          label: 브라우저
          placeholder: Chrome, Safari, Firefox 등
      validations:
          required: true

    - type: textarea
      id: evidence
      attributes:
          label: 스크린샷 또는 로그
          description: 필요한 경우 이미지를 끌어다 놓거나 오류 로그를 붙여넣어 주세요.

