name: CI

on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main
            - dev

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/noslog
            COOKIE_PASSWORD: ci-only-cookie-password-at-least-32-characters
            BOOKMARKLET_SECRET: ci-only-bookmarklet-secret-at-least-32-characters

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Type check
              run: npm run typecheck

            - name: Build
              run: npm run build
