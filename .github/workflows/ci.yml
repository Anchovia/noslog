name: CI

on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main
            - dev

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/noslog
            COOKIE_PASSWORD: ci-only-cookie-password-at-least-32-characters
            BOOKMARKLET_SECRET: ci-only-bookmarklet-secret-at-least-32-characters

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check dependency declarations
              run: npm run check:dependencies

            - name: Audit production dependencies
              run: npm run audit:production

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Type check
              run: npm run typecheck

            - name: Build
              run: npm run build

    storybook:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Test component interactions and accessibility
              run: npm run test:storybook

            - name: Build Storybook
              run: npm run build-storybook

    visual:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        container:
            image: mcr.microsoft.com/playwright:v1.61.1-noble
            options: --ipc=host
        env:
            STORYBOOK_VISUAL_RESULTS: test-results/visual
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Build isolated Storybook
              run: npm run build-storybook
            - name: Compare screenshots and responsive form contracts
              run: npm run test:visual
            - name: Upload visual differences
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: storybook-visual-differences
                  path: test-results/visual/
                  retention-days: 7

    e2e:
        if: ${{ vars.RUN_E2E == 'true' }}
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 45
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: noslog_e2e
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d noslog_e2e"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            CI: "true"
            E2E_SEED: "1"
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/noslog_e2e
            COOKIE_PASSWORD: ci-only-cookie-password-at-least-32-characters
            BOOKMARKLET_SECRET: ci-only-bookmarklet-secret-at-least-32-characters

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Apply database migrations
              run: npm run db:migrate:deploy

            - name: Seed E2E database
              run: npm run db:seed:e2e

            - name: Import music catalog into E2E database
              run: node prisma/import-music-catalog.mjs --apply

            - name: Run Playwright E2E
              run: npm run test:e2e

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
