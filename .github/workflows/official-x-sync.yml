name: Sync official X news

on:
    schedule:
        # UTC 00:17 / 12:17 = KST 09:17 / 21:17. Avoid the busy top of the hour.
        - cron: "17 0,12 * * *"
    workflow_dispatch:

permissions: {}

concurrency:
    group: official-x-sync
    cancel-in-progress: false

jobs:
    sync:
        # Register the URL only after the production migration and deployment are ready.
        if: ${{ vars.OFFICIAL_X_SYNC_URL != '' }}
        runs-on: ubuntu-latest
        timeout-minutes: 4
        steps:
            - name: Refresh stored official news
              env:
                  SYNC_URL: ${{ vars.OFFICIAL_X_SYNC_URL }}
                  SYNC_SECRET: ${{ secrets.OFFICIAL_X_SYNC_SECRET }}
              run: |
                  set -euo pipefail
                  test -n "$SYNC_SECRET"
                  case "$SYNC_URL" in
                      https://*) ;;
                      *) echo "OFFICIAL_X_SYNC_URL must use HTTPS" >&2; exit 1 ;;
                  esac
                  # No redirects or automatic retries: keep credentials and paid calls bounded.
                  response_file=$(mktemp)
                  trap 'rm -f "$response_file"' EXIT
                  status=$(curl --silent --show-error --proto '=https' \
                      --connect-timeout 10 --max-time 135 \
                      --header "Authorization: Bearer $SYNC_SECRET" \
                      --output "$response_file" --write-out '%{http_code}' "$SYNC_URL")
                  # 실패하면 왜 실패했는지 남긴다 — 응답의 code · message 만(비밀값은 본문에 없다).
                  # 2026-09-23 두 번 실패했을 때 로그에 이유가 없어 원인을 좁히지 못했다
                  if [ "$status" != "200" ]; then
                      echo "HTTP $status" >&2
                      jq -r '"\(.code // "UNKNOWN"): \(.message // "no message")"' \
                          "$response_file" >&2 || head -c 300 "$response_file" >&2
                      exit 1
                  fi
                  jq -e '.isSuccess == true' "$response_file" >/dev/null
                  jq -r '.result.status' "$response_file"
